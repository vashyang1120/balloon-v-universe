<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知識學院書本｜Batch 3-A Test 1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9efff;color:#241a42;font:16px system-ui,sans-serif}
header{width:min(calc(100% - 24px),1242px);margin:12px auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:1rem;margin:0 auto 0 0}
nav{display:flex;gap:8px;flex-wrap:wrap}
a,button{font:inherit;font-size:.85rem;color:inherit;background:#fff;border:1px solid #c8bce2;border-radius:6px;padding:5px 8px;text-decoration:none;cursor:pointer}
main{width:min(calc(100% - 16px),calc((100dvh - 72px)*1.5));margin:auto}
main{position:relative;overflow:hidden;border-radius:12px;background:#9fd8ff}
#scene{display:block;width:100%;height:auto}
#page-turn{position:absolute;pointer-events:none}
.detail main{width:min(calc(100% - 16px),648px)}
@media(max-width:899px),(max-aspect-ratio:1/1){main{width:calc(100% - 16px)}}
</style>
</head>
<body>
<header>
<h1>知識學院書本｜Batch 3-A Test 1</h1>
<nav aria-label="預覽方式">
<a href="?">大廳原比例</a>
<a href="?view=detail">4× 局部</a>
<button type="button">重新播放</button>
</nav>
<output aria-live="polite"></output>
</header>
<main><canvas id="scene" aria-label="知識學院大廳"></canvas><canvas id="page-turn" aria-label="書本翻頁動畫"></canvas></main>
<script src="book.js"></script>
</body>
</html>
