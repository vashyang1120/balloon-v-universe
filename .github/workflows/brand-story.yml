name: Brand Story browser review
on:
  pull_request:
    branches: [main]
    paths: [index.html, main.js, zones.js, 'staging/**', '.github/workflows/brand-story.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble the isolated site
        run: |
          scratch="$(mktemp -d)"
          git init -q "$scratch/adventure"
          git -C "$scratch/adventure" fetch --depth=1 https://github.com/vashyang1120/balloon-v-rush.git "$(cat staging/adventure-revision.txt)"
          git -C "$scratch/adventure" checkout -q --detach FETCH_HEAD
          CF_PAGES_BRANCH=dev/universe-brand-story-v1 node staging/build.mjs . "$scratch/adventure" "$scratch/site" https://balloon-v-universe-staging.pages.dev https://balloon-v-universe-api-staging.vashyang1120.workers.dev
          echo "BRAND_STORY_SITE=$scratch/site" >> "$GITHUB_ENV"
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Run desktop and mobile browser checks
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$BRAND_STORY_SITE" > /tmp/brand-story-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8000/ > /dev/null
          node staging/brand-story-browser.mjs
      - name: Verify published preview and capture screenshots
        env:
          BRAND_STORY_URL: https://dev-universe-brand-story-v1.balloon-v-universe-staging.pages.dev/
        run: |
          for attempt in {1..24}; do
            if curl -fsS "${BRAND_STORY_URL}?build=${GITHUB_SHA}" | grep -q 'Universe Brand Story v1.0-test-1'; then break; fi
            if [ "$attempt" -eq 24 ]; then exit 1; fi
            sleep 5
          done
          node staging/brand-story-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-story-browser-screenshots
          path: brand-story-screenshots/
