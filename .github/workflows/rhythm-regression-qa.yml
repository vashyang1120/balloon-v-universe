name: Rhythm v2.7 tutorial and MV regression (isolated QA)
on:
  push:
    branches: [qa/rhythm-v2.6.5-regression]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 634f1ba84ea28b34b33f6cf8a472b1eb8b87b14a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate
        run: git rev-parse HEAD
      - name: JavaScript syntax
        run: |
          for f in universe/rhythm/*.js test/rhythm-v2.7/*.js; do node --check "$f" || exit 1; done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { inlineScripts } from './universe/shared/tools/js-functions.mjs';
          fs.writeFileSync('/tmp/rhythm-inline.js', inlineScripts(fs.readFileSync('universe/rhythm/index.html', 'utf8')));
          fs.writeFileSync('/tmp/mv-inline.js', inlineScripts(fs.readFileSync('test/rhythm-v2.7/index.html', 'utf8')));
          JS
          node --check /tmp/rhythm-inline.js
          node --check /tmp/mv-inline.js
          node --test test/rhythm-v2.7/tests/*.test.mjs
      - name: Rhythm core and shared SDK tests
        if: always()
        run: node --test universe/rhythm/tests/*.test.mjs universe/shared/tests/*.test.mjs
      - name: All repository tests
        if: always()
        run: |
          git clone --depth 1 https://github.com/vashyang1120/vparty-quiz-game.git /tmp/bv-quiz
          export BV_QUIZ_BANK=/tmp/bv-quiz/quiz_questions.json
          test -s "$BV_QUIZ_BANK"
          find tests universe -name '*.test.mjs' -print0 | xargs -0 node --test
          node --test universe/tetris-ui-test/tests/balloon-assets.test.cjs
          git clone --filter=blob:none --no-checkout https://github.com/vashyang1120/vparty-rhythm-game.git /tmp/bv-rhythm-generator
          git -C /tmp/bv-rhythm-generator checkout 9caa7dcb669ccbe83feedcb85c6237d773ad9b31 -- index.html
          python3 -I universe/rhythm/tools/build_prototype.py /tmp/bv-rhythm-generator/index.html /tmp/rhythm-generated.html
          cmp /tmp/rhythm-generated.html universe/rhythm/index.html
      - name: Verify asset identity and release scope
        if: always()
        run: |
          diff -qr test/rhythm-v2.7/assets universe/rhythm/assets
          test -s assets/audio/universe_lobby_bgm.mp3
          for f in v_full_open_arms v_bust_congrats v_bust_happy v_bust_point v_bust_remind; do test -s "assets/rpg/$f.png" || exit 1; done
          test -s assets/ui/avatar_frame_pink_idle.png
          git diff --name-only d166d988a244124ee1f84d238467e14dd2f1fb3e HEAD | awk '!/^universe\/rhythm\// { bad=1; print } END { exit bad }'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 634f1ba84ea28b34b33f6cf8a472b1eb8b87b14a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and source assets
        run: |
          npm install --global playwright
          npx --yes playwright install --with-deps chromium
          git clone --depth 1 https://github.com/vashyang1120/vparty-rhythm-game.git /tmp/bv-rhythm
          git clone --depth 1 https://github.com/vashyang1120/vparty-quiz-game.git /tmp/bv-quiz
      - name: Release E2E with fake Worker database
        run: |
          cat > universe/tests/browser/rhythm-release-qa.mjs <<'JS'
          import { createHarness, sleep } from "./harness.mjs";
          import { rhythmData, invariant } from "../../../backend/worker/tests/launch-helpers.js";
          const [R,Q,OUT] = process.argv.slice(2);
          const ids = ["btn-retry","rv-btn-r-songs","btn-r-lb","btn-r-home"];
          const assert = (x,msg) => { if (!x) throw Error(msg); console.log("PASS",msg); };
          const screen = (p,id) => p.waitForSelector("#"+id+":not(.off)",{timeout:15000});
          const ready = p => p.waitForFunction(() => window.UniverseRhythm?.isReady() && window.RV27UI && document.body.classList.contains("rv27-ui"),null,{timeout:15000});
          const click = (p,id) => p.locator("#"+id).click({timeout:15000});
          const val = (p,id) => p.locator("#"+id).textContent();
          async function resultFit(p) {
            return p.evaluate(ids=>ids.every(id=>{const e=document.getElementById(id),r=e.getBoundingClientRect();return !!r.width&&!!r.height&&r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1}),ids);
          }
          for (const official of [true,false]) {
           const H=await createHarness({clones:{tetris:R,rhythm:R,quiz:Q},out:OUT+"/"+(official?"official":"fallback"),flags:{SCORES_ENABLED:official?"on":"off",REWARDS_ENABLED:official?"on":"off",TRIAL_PLAYER_IDS:""}});
           try {
           const A=await H.apiCreate("節奏回歸甲","boy1"), B=await H.apiCreate("節奏回歸乙","girl2");
           const profileBefore=JSON.stringify(H.db.get("players/"+A.playerId+"/profile"));
           const {ctx,page:p}=await H.newPage({mobile:true,viewport:{width:844,height:390}});
           await p.goto(H.ORIGIN+"/universe/rhythm/?bvPlayerId="+A.playerId);
           await ready(p);
           await p.waitForFunction(()=>RVCoach.debug().mode==='welcome');
           await p.locator('.rv-coach-card .btn-outline').click();
           await p.waitForFunction(v=>UniverseRhythm.session.official.isEnabled()===v,official,{timeout:15000});
           await sleep(900);
           assert((await val(p,"rv-player-name"))==="節奏回歸甲","identity card "+official);
           assert((await val(p,"game-version")).includes("v2.7.0"),"version");
           assert(await p.evaluate(()=>document.getElementById("rv-player-avatar").naturalWidth>0),"avatar asset");
           assert(await p.evaluate(()=>!window.BV_TEST_ISOLATION&&!document.getElementById("bv-test-chooser")),"no test isolation");
           await p.screenshot({path:H.out+"/home.png"});
           console.log("BGM before gesture", JSON.stringify(await p.evaluate(()=>RV27Audio.debug())));
           await p.locator("#rv-player-name").click(); // trusted gesture; does not navigate
           await p.waitForFunction(()=>RV27Audio.debug().unlocked && RV27Audio.debug().playing && RV27Audio.debug().time>0,null,{timeout:15000}).catch(async e=>{console.log("BGM diagnostics",JSON.stringify(await p.evaluate(()=>({audio:RV27Audio.debug(),shouldPlay:RV27Audio.shouldPlay(),active:navigator.userActivation.hasBeenActive,hidden:document.hidden}))));throw e;});
           assert(await p.evaluate(()=>RV27Audio.debug().els<=2),"menu BGM active");
           await click(p,"btn-profile-go"); await screen(p,"s-profile");
           assert(await p.evaluate(()=>document.getElementById("player-id-input").readOnly&&PLAYER.playerKey===""),"locked identity");
           await click(p,"btn-profile-back"); await screen(p,"s-title");
           await click(p,"btn-play"); await screen(p,"s-songlist");
           await p.waitForFunction(()=>SONGS.length>=9,null,{timeout:15000});
           await click(p,"song-next"); await click(p,"song-prev");
           await p.evaluate(()=>{songIdx=SONGS.findIndex(s=>s.id==="song005");renderSongCards();});
           await p.locator('#diff-wrap .db[data-d="normal"]').click();
           await p.screenshot({path:H.out+"/songselect.png"});
           const fixture=rhythmData("song005","normal",0.9);
           async function round(retry=false) {
            await click(p,retry?"btn-retry":"btn-start");
            await screen(p,"s-game"); await p.waitForFunction(()=>G.running,null,{timeout:35000});
            await sleep(500);
            assert(await p.evaluate(()=>!!audioBuffer&&document.querySelectorAll("#lanes .lane").length===4&&!RV27Audio.debug().playing),"real MP3 decoded, lanes, menu BGM stopped");
            if (!retry) {
             await p.setViewportSize({width:390,height:844});
             await p.waitForFunction(()=>!document.getElementById("rv-rotate-mask").hidden&&G.paused);
             await p.setViewportSize({width:844,height:390});
             await p.waitForFunction(()=>document.getElementById("rv-rotate-mask").hidden&&G.paused);
             await click(p,"btn-resume"); await sleep(400);
             await p.setViewportSize({width:390,height:844});
             await p.waitForFunction(()=>!isResumeCountingDown&&G.paused);
             await p.setViewportSize({width:844,height:390}); await sleep(250);
             assert(await p.evaluate(()=>G.paused&&!isResumeCountingDown),"portrait cancels countdown");
             await click(p,"btn-resume"); await p.waitForFunction(()=>!G.paused&&!isResumeCountingDown,null,{timeout:10000});
            }
            if (official) await p.waitForFunction(()=>UniverseRhythm.session.official.isEnabled());
            H.clock.offset+=240000;
            // Controlled valid score fixture; real game start and endGame/saveScore/SDK/Worker path, not real note-hit equivalence.
            await p.evaluate(d=>{G.perf=d.perfect;G.good=d.good;G.miss=d.miss;G.maxCombo=d.maxCombo;G.score=d.score;G.total=d.perfect+d.good+d.miss;endGame();},fixture);
            await screen(p,"s-result");
            await p.waitForFunction(on=>{let t=document.getElementById("bv-result-note").textContent;return on?/已記入正式排行榜/.test(t):/本分頁測試成績/.test(t)},official,{timeout:20000});
            await sleep(1800);
            assert(Number((await val(p,"r-score")).replace(/,/g,""))===fixture.score,"exact result score");
            assert(await resultFit(p),"result buttons fit 844x390");
            await p.setViewportSize({width:568,height:320}); await sleep(300);
            assert(await resultFit(p),"result buttons fit 568x320");
            await p.screenshot({path:H.out+"/result-"+(retry?2:1)+".png"});
            await p.setViewportSize({width:844,height:390});
            await p.waitForFunction(()=>RV27Audio.debug().playing,null,{timeout:15000});
           }
           await round();
           let w=H.db.get("wallets/"+A.playerId);
           if(official) {
            assert(w&&w.balance>0&&invariant(H.db,A.playerId)===w.balance,"official wallet ledger reconciles");
            assert(!!H.db.get("leaderboards/rhythm/song005--normal/"+A.playerId),"official leaderboard record");
           } else {
            assert(!w&&!H.db.get("scores")&&!H.db.get("leaderboards"),"fallback has no server score or reward");
           }
           assert(await p.evaluate(()=>!document.getElementById("r-rec").classList.contains("hidden")),"first accepted or local personal record shown");
           if(official) assert(Object.values(H.db.get("scores")||{}).some(r=>r.gameVersion==="rhythm-v2.7.0+universe-v0.3.1"),"new server version recorded");
           const balance=w?.balance||0;
           await click(p,"rv-btn-r-songs"); await screen(p,"s-songlist");
           await p.waitForFunction(()=>document.getElementById("rv-best-value").textContent.includes("分"),null,{timeout:15000});
           assert((await val(p,"rv-best-value")).includes(String(fixture.score)),"best score read");
           await click(p,"btn-start").catch(e=>{throw e}); await screen(p,"s-game");
           await p.waitForFunction(()=>G.running,null,{timeout:35000});
           H.clock.offset+=240000;
           await p.evaluate(d=>{G.perf=d.perfect;G.good=d.good;G.miss=d.miss;G.maxCombo=d.maxCombo;G.score=d.score;G.total=d.perfect+d.good+d.miss;endGame();},fixture);
           await screen(p,"s-result");
           await p.waitForFunction(on=>{let t=document.getElementById("bv-result-note").textContent;return on?/已記入正式排行榜/.test(t):/本分頁測試成績/.test(t)},official,{timeout:20000});
           await sleep(1800);
           if(official) assert(invariant(H.db,A.playerId)===balance,"second song no duplicate daily rewards");
           assert(await p.evaluate(()=>document.getElementById("r-rec").classList.contains("hidden")),"repeat score not new record");
           await click(p,"btn-r-lb"); await screen(p,"s-lb");
           await p.waitForFunction(()=>document.getElementById("lb-list").textContent.includes("節奏回歸甲"),null,{timeout:15000});
           await click(p,"btn-lb-home"); await screen(p,"s-title");
           await p.goto(H.ORIGIN+"/universe/rhythm/?bvPlayerId="+B.playerId); await ready(p);
           assert((await val(p,"rv-player-name"))==="節奏回歸乙","switch player");
           await p.waitForFunction(()=>RVCoach.debug().mode==="welcome");await p.keyboard.press("Escape");
           assert(await p.evaluate(()=>!RVCoach.active()),"new player independent tutorial preference");
           assert(!H.db.get("wallets/"+B.playerId),"no cross-player rewards");
           assert(JSON.stringify(H.db.get("players/"+A.playerId+"/profile"))===profileBefore,"identity unchanged");
           assert(p.errors.length===0,"no page errors: "+p.errors.join(" | "));
           await click(p,"bv-btn-lobby"); await p.waitForURL(/\/index\.html$/,{timeout:15000});
           await ctx.close();
           assert(!H.external.some(u=>/firebase|workers\.dev/.test(u)),"external writes blocked");
           console.log("E2E MODE PASS",official?"official":"fallback");
           } finally {await H.finish(official?"official-rhythm":"fallback-rhythm");}
          }
          
          JS
          export NODE_PATH="$(npm root -g)"
          node universe/tests/browser/rhythm-release-qa.mjs /tmp/bv-rhythm /tmp/bv-quiz /tmp/rhythm-qa
      - name: Isolated MV browser E2E (stub provider and blocked provider)
        run: |
          export NODE_PATH="$(npm root -g)"
          cat > universe/tests/browser/mv-qa.mjs <<'JS'
          import {createHarness,sleep} from "./harness.mjs";
          const [R,Q,OUT]=process.argv.slice(2);
          const H=await createHarness({clones:{tetris:R,rhythm:R,quiz:Q},out:OUT,flags:{SCORES_ENABLED:"on",REWARDS_ENABLED:"on"}});
          const assert=(ok,m)=>{if(!ok)throw Error(m);console.log("PASS",m)};
          try {
            for(const mode of ["ready","timeout"]){
              const {ctx,page:p}=await H.newPage({mobile:true,viewport:{width:844,height:390}});
              if(mode==="ready") await p.addInitScript(()=>{
                window.mvTestPlayers=[];
                window.YT={Player:class{
                  constructor(id,o){this.o=o;this.t=0;this.plays=0;this.pauses=0;this.seeks=[];window.mvTestPlayers.push(this);setTimeout(()=>o.events.onReady({target:this}),10);}
                  cueVideoById(o){this.t=o.startSeconds;setTimeout(()=>this.o.events.onStateChange({data:5,target:this}),50);}
                  mute(){this.muted=true;}
                  playVideo(){this.plays++;this.started=performance.now();this.o.events.onStateChange({data:1,target:this});}
                  pauseVideo(){this.pauses++;}
                  seekTo(t){this.t=t;this.seeks.push(t);}
                  getCurrentTime(){return this.t;}
                  getDuration(){return 180;}
                  destroy(){this.destroyed=true;}
                }};
              });
              await p.goto(H.ORIGIN+"/test/rhythm-v2.7/?bvTestMock=1");
              await p.waitForFunction(()=>window.UniverseRhythm?.isReady()&&window.RVMV&&window.RV27UI,null,{timeout:15000});
              assert(await p.evaluate(()=>BV_TEST_ISOLATION.version==="v2.7.0-tutorial-test-3"&&!UniverseRhythm.session.official.isEnabled()),"isolated "+mode);
              await p.locator(".rv-coach-card .btn-outline").click();
              await p.locator("#btn-play").click();
              await p.waitForFunction(()=>SONGS.length>=9);
              await p.evaluate(()=>{songIdx=SONGS.findIndex(s=>s.id==="song005");renderSongCards();selectedSong.youtubeId="Ba_DPuAf0qU";selectedSong.videoUrl="";});
              await p.locator("#btn-start").click();
              if(mode==="ready"){
                await p.waitForFunction(()=>RVMV.debug()?.ready);
                assert(await p.evaluate(()=>mvTestPlayers[0].muted&&mvTestPlayers[0].plays===0&&!G.running),"muted and no play before countdown");
              }
              await p.waitForFunction(()=>G.running&&!!audioSource,null,{timeout:40000});
              assert(await p.evaluate(()=>!!audioBuffer&&!RV27Audio.debug().playing),"MP3 and game started "+mode);
              if(mode==="ready"){
                assert(await p.evaluate(()=>mvTestPlayers.length===1&&mvTestPlayers[0].plays===1),"single player at GO");
                await p.setViewportSize({width:390,height:844});
                await p.waitForFunction(()=>G.paused&&!RVMV.debug().want);
                await p.setViewportSize({width:844,height:390});
                await p.locator("#btn-resume").click();
                await p.waitForFunction(()=>!G.paused&&RVMV.debug().want,null,{timeout:10000});
                assert(await p.evaluate(()=>mvTestPlayers.length===1&&mvTestPlayers[0].plays===2),"same player resume");
              }else assert(await p.evaluate(()=>!RVMV.debug().ready),"provider blocked does not prevent game");
              await p.evaluate(()=>{G.perf=20;G.good=10;G.miss=0;G.total=30;G.score=7500;G.maxCombo=30;endGame();});
              await p.waitForSelector("#s-result:not(.off)");
              assert(await p.evaluate(()=>RVMV.debug()===null),"stop at result");
              await p.screenshot({path:H.out+"/"+mode+".png"});
              assert(!p.errors.length,"no JS errors "+p.errors.join(" | "));
              await ctx.close();
            }
            assert(!H.apiCalls.some(x=>!/^(GET|HEAD) /.test(x)),"no production API writes");
            assert(!H.db.get("scores")&&!H.db.get("wallets"),"no formal scores or rewards");
          }finally{await H.finish("mv-qa");}
          JS
          node universe/tests/browser/mv-qa.mjs /tmp/bv-rhythm /tmp/bv-quiz /tmp/rhythm-qa/mv
      - name: Tutorial real engine and external playlist BGM
        run: |
          cat > universe/tests/browser/tutorial-qa.mjs <<'JS'
          import {createHarness,sleep} from "./harness.mjs";
          const [R,Q,OUT]=process.argv.slice(2);
          const H=await createHarness({clones:{tetris:R,rhythm:R,quiz:Q},out:OUT,flags:{SCORES_ENABLED:"on",REWARDS_ENABLED:"on"}});
          const assert=(ok,m)=>{if(!ok)throw Error(m);console.log("PASS",m)};
          try{
            const A=await H.apiCreate("正式教學驗證","boy1");
            const {ctx,page:p}=await H.newPage({mobile:true,viewport:{width:844,height:390}});
            await p.addInitScript(()=>{
              window.open=(url)=>{window.testPlaylist=url;window.testPausedAtOpen=window.RV27Audio.debug();return null;};
              window.mvTestPlayers=[];
              window.YT={Player:class{
                constructor(id,o){this.o=o;this.t=0;this.plays=0;this.pauses=0;this.seeks=[];window.mvTestPlayers.push(this);setTimeout(()=>o.events.onReady({target:this}),10);}
                cueVideoById(o){this.t=o.startSeconds;this.cue=o;setTimeout(()=>this.o.events.onStateChange({data:5,target:this}),50);}
                mute(){this.muted=true;}
                playVideo(){this.plays++;this.o.events.onStateChange({data:1,target:this});}
                pauseVideo(){this.pauses++;}
                seekTo(t){this.t=t;this.seeks.push(t);}
                getCurrentTime(){return this.t;}
                getDuration(){return 392;}
                destroy(){this.destroyed=true;}
              }};
            });
            await p.goto(H.ORIGIN+"/universe/rhythm/?bvPlayerId="+A.playerId);
            await p.waitForFunction(()=>window.UniverseRhythm?.isReady()&&window.RVCoach&&window.RV27UI);
            await p.waitForFunction(()=>UniverseRhythm.session.official.isEnabled());
            const writesBefore=H.apiCalls.filter(x=>!/^(GET|HEAD) /.test(x)).length;
            await p.waitForFunction(()=>RVCoach.debug().mode==="welcome");
            await p.locator(".rv-coach-card .btn-outline").click();
            await p.reload();await p.waitForFunction(()=>UniverseRhythm.isReady());
            await sleep(500);
            assert(await p.evaluate(()=>!RVCoach.active()),"skip persisted across reload");
            await p.locator("#rv-player-name").click();
            await p.waitForFunction(()=>RV27Audio.debug().playing&&RV27Audio.debug().time>0);
            await p.locator("#rv-btn-watch-mv").click();
            assert(await p.evaluate(()=>testPlaylist.includes("PLCxWyaG1VhB7wvvXJtJ3T8qfxNM6wOUQx")&&testPausedAtOpen.external&&!testPausedAtOpen.playing&&testPausedAtOpen.paused.every(Boolean)),"BGM paused before playlist");
            await p.locator("#rv-player-name").click();
            await p.waitForFunction(()=>RV27Audio.debug().playing);
            await p.locator("#rv-btn-tutorial").click();
            const next=()=>p.keyboard.press("Space");
            await next();
            await p.waitForFunction(()=>RVCoach.debug().mode==="explain",null,{timeout:60000});
            assert(await p.evaluate(()=>G.song.id==="song009"&&G.tutorialClipStart===207&&G.paused&&!audioSource&&G.notes.length>0&&mvTestPlayers.length===1&&!RVMV.debug().want),"real MV scene paused with notes");
            assert(await p.evaluate(()=>{const n=G.notes.find(n=>n.lane===0&&!n.hit);const r=n.el.getBoundingClientRect(),l=laneEls[0].getBoundingClientRect();return r.left>=l.left&&r.right<=l.right&&r.width>0;}),"first note physically inside mobile lane");
            const checkpoint=await p.evaluate(()=>RVCoach.debug().checkpoint);
            await next();
            assert(await p.locator(".rv-coach-arrow").isVisible(),"white line arrow");
            assert(await p.evaluate(()=>{const a=document.querySelector(".rv-coach-line img").getBoundingClientRect(),b=document.querySelector("#lanes .hline").getBoundingClientRect();return b.left-a.right>=0&&b.left-a.right<32;}),"V-13 beside judgment line");
            await p.screenshot({path:H.out+"/line-explanation.png"});
            await next();
            await p.waitForFunction(()=>RVCoach.debug().mode==="retry",null,{timeout:12000});
            assert(await p.evaluate(()=>Math.abs(G.gt-RVCoach.debug().checkpoint*1000)<1&&G.miss===0&&G.notes.length>0&&mvTestPlayers.length===1&&Math.abs(RVMV.debug().time-207-RVCoach.debug().checkpoint)<0.001),"retry rewinds chart and resets counters");
            await next();
            async function hit(lane,hold=0){
              await p.waitForFunction(l=>G.running&&!G.paused&&G.notes.some(n=>n.lane===l&&!n.hit&&!n.missed&&Math.abs(n.hitTime-G.gt)<65),lane,{timeout:12000,polling:10});
              await p.keyboard.down(["d","f","j","k"][lane]);
              if(hold)await sleep(hold);
              await p.keyboard.up(["d","f","j","k"][lane]);
            }
            await hit(0);await p.waitForFunction(()=>RVCoach.debug().mode==="success");await next();
            await p.waitForFunction(()=>RVCoach.debug().mode==="explain"&&RVCoach.debug().stage===1);await next();
            for(const lane of [0,1,2,3])await hit(lane);
            await p.waitForFunction(()=>RVCoach.debug().mode==="success");await next();
            await p.waitForFunction(()=>RVCoach.debug().mode==="explain"&&RVCoach.debug().stage===2);await next();
            await hit(2,100);await p.waitForFunction(()=>RVCoach.debug().mode==="retry");
            await next();await hit(2,1700);await hit(3,1300);
            await p.waitForFunction(()=>RVCoach.debug().mode==="success");await next();
            await p.waitForFunction(()=>RVCoach.debug().mode==="complete",null,{timeout:30000});
            assert(await p.evaluate(()=>!G.running&&!audioSource&&RVMV.debug()===null),"completion stops media");
            await next();await p.waitForSelector("#s-title:not(.off)");
            await p.locator("#rv-btn-tutorial").click();await p.keyboard.press("Escape");await p.waitForFunction(()=>!RVCoach.active()&&!G.running);assert(true,"Escape exits tutorial");
            assert(H.apiCalls.filter(x=>!/^(GET|HEAD) /.test(x)).length===writesBefore&&!H.db.get("scores")&&!H.db.get("wallets"),"no formal writes");
